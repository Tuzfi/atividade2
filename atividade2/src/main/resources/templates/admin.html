<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>

<body>
    <div class="admin">
        <div class="admin-container">
            <span class="admin-badge">ÁREA RESTRITA</span>
            <h1>PAINEL ADMIN</h1>
            <p class="welcome-text">Logado como <strong th:text="${username}">admin</strong></p>

            <div class="admin-actions">
                <a href="/home" class="btn btn-secondary">Voltar para Home</a>

                <form th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-logout">Sair</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
